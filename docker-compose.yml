version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: repo-sudoe-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-repo_sudoe_ai}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-repo_sudoe_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - repo-sudoe-network
    restart: unless-stopped

  # Django Application with Gunicorn (Production)
  web:
    build: .
    container_name: repo-sudoe-web
    command: >
      bash -c "
        python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn config.wsgi:application --config gunicorn.conf.py
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - repo-sudoe-network
    restart: unless-stopped


  # Ollama - IA local (Fase 5, opcional)
  ollama:
    image: ollama/ollama:latest
    container_name: repo-sudoe-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - repo-sudoe-network
    restart: unless-stopped
    # Para usar GPU NVIDIA (requiere nvidia-container-toolkit instalado en el host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Nginx (Optional - for production with reverse proxy)
  nginx:
    image: nginx:alpine
    container_name: repo-sudoe-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - web
    networks:
      - repo-sudoe-network
    restart: unless-stopped
    profiles:
      - production  # Only start with: docker-compose --profile production up

volumes:
  postgres_data:
  static_volume:
  media_volume:
  ollama_models:

networks:
  repo-sudoe-network:
    driver: bridge
